<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- PLACEHOLDER ART — הג׳ונגל -->
  <defs>
    <linearGradient id="jsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDF3D5"/><stop offset="1" stop-color="#F3FAEC"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FA4D6"/><stop offset="1" stop-color="#6CC5E8"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#jsky)"/>
  <!-- far hills -->
  <path d="M0 420 Q200 300 400 400 T800 380 T1200 420 T1600 360 L1600 1000 L0 1000 Z" fill="#9AD08A"/>
  <path d="M0 520 Q300 420 600 520 T1200 500 T1600 540 L1600 1000 L0 1000 Z" fill="#6DBF6A"/>
  <path d="M0 640 Q400 580 800 660 T1600 620 L1600 1000 L0 1000 Z" fill="#3E8E4E"/>
  <!-- waterfall -->
  <rect x="1420" y="300" width="60" height="330" rx="20" fill="#7CD0EC" opacity="0.9"/>
  <ellipse cx="1450" cy="640" rx="90" ry="24" fill="#BFE8FA" opacity="0.8"/>
  <!-- river -->
  <path d="M0 880 Q200 800 420 860 T880 800 T1300 820 T1600 760 L1600 900 Q1300 940 880 880 T420 930 T0 960 Z" fill="url(#river)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round">
    <path d="M200 870 q30 -10 60 0 t60 0"/><path d="M700 830 q30 -10 60 0 t60 0"/><path d="M1150 820 q30 -10 60 0 t60 0"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="130" y="380" width="46" height="330" rx="12" fill="#7A4E2D"/>
    <circle cx="150" cy="330" r="130" fill="#4FA85B"/><circle cx="60" cy="380" r="80" fill="#5BBF6B"/><circle cx="240" cy="370" r="90" fill="#3E8E4E"/>
    <rect x="1080" y="260" width="50" height="420" rx="12" fill="#7A4E2D"/>
    <circle cx="1105" cy="210" r="140" fill="#4FA85B"/><circle cx="1000" cy="280" r="90" fill="#5BBF6B"/><circle cx="1210" cy="270" r="100" fill="#3E8E4E"/>
    <rect x="1300" y="330" width="40" height="330" rx="12" fill="#7A4E2D"/>
    <circle cx="1320" cy="290" r="100" fill="#5BBF6B"/>
    <rect x="620" y="200" width="44" height="380" rx="12" fill="#7A4E2D"/>
    <circle cx="642" cy="170" r="120" fill="#4FA85B"/><circle cx="560" cy="230" r="80" fill="#5BBF6B"/><circle cx="730" cy="230" r="90" fill="#3E8E4E"/>
  </g>
  <!-- rope bridge between trees (top right, ~1184,420) -->
  <g fill="none" stroke="#8A5F36" stroke-width="6">
    <path d="M1130 400 Q1215 440 1300 400"/><path d="M1130 440 Q1215 480 1300 440"/>
    <path d="M1150 408 v32 M1180 420 v32 M1215 426 v32 M1250 420 v32 M1280 408 v32" stroke-width="4"/>
  </g>
  <!-- monkey in tree (ambient 960,260) -->
  <g transform="translate(980 300)"><circle r="26" fill="#8A5F36"/><circle cx="-8" cy="-4" r="4" fill="#2B2A33"/><circle cx="8" cy="-4" r="4" fill="#2B2A33"/><ellipse cy="8" rx="12" ry="7" fill="#E0AC82"/></g>
  <text x="1010" y="340" font-size="30">🍌</text>
  <!-- fallen log (~480,600) -->
  <g transform="rotate(-8 480 610)"><rect x="380" y="590" width="220" height="44" rx="22" fill="#8A5F36"/><ellipse cx="380" cy="612" rx="14" ry="22" fill="#B07D4C"/></g>
  <!-- bush with eyes (ambient 640,680) -->
  <ellipse cx="672" cy="700" rx="70" ry="44" fill="#2E7D3C"/>
  <!-- flowers & mushrooms -->
  <g>
    <circle cx="300" cy="760" r="12" fill="#F25C7A"/><circle cx="330" cy="780" r="10" fill="#FFB61E"/><circle cx="1000" cy="720" r="12" fill="#8C6BD9"/>
    <path d="M840 700 h40 v-10 a20 12 0 0 0 -40 0 z" fill="#E5533C"/><rect x="855" y="700" width="10" height="20" fill="#FFF8EC"/>
  </g>
  <!-- animals -->
  <text x="220" y="560" font-size="40">🦜</text><text x="1380" y="720" font-size="40">🐸</text><text x="760" y="560" font-size="40">🦋</text>
  <text x="520" y="960" font-size="40">🐊</text><text x="1500" y="600" font-size="40">🐍</text><text x="880" y="640" font-size="34">🦋</text>
  <!-- decoy explorers -->
  <g>
    <circle cx="360" cy="720" r="16" fill="#F5C9A5"/><rect x="346" y="736" width="28" height="34" rx="8" fill="#C9A227"/>
    <circle cx="1240" cy="700" r="16" fill="#E0AC82"/><rect x="1226" y="716" width="28" height="34" rx="8" fill="#F25C7A"/>
    <circle cx="960" cy="760" r="16" fill="#F5C9A5"/><rect x="946" y="776" width="28" height="30" rx="8" fill="#2FA4D6"/>
  </g>
</svg>
