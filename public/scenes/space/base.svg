<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- PLACEHOLDER ART — החלל -->
  <defs>
    <radialGradient id="deep" cx="0.5" cy="0.3" r="0.9"><stop offset="0" stop-color="#2A2F6E"/><stop offset="1" stop-color="#0F1230"/></radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8B9CC"/><stop offset="1" stop-color="#8E8FA8"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#deep)"/>
  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="60" r="3"/><circle cx="200" cy="140" r="2"/><circle cx="330" cy="40" r="2.5"/><circle cx="480" cy="120" r="2"/><circle cx="620" cy="60" r="3"/>
    <circle cx="760" cy="150" r="2"/><circle cx="900" cy="40" r="2.5"/><circle cx="1000" cy="130" r="2"/><circle cx="1180" cy="60" r="3"/><circle cx="1320" cy="140" r="2"/>
    <circle cx="1480" cy="50" r="2.5"/><circle cx="1560" cy="180" r="2"/><circle cx="150" cy="300" r="2"/><circle cx="420" cy="260" r="2.5"/><circle cx="700" cy="300" r="2"/>
    <circle cx="880" cy="250" r="2"/><circle cx="1240" cy="330" r="2.5"/><circle cx="1500" cy="300" r="2"/><circle cx="60" cy="480" r="2"/><circle cx="360" cy="470" r="2"/>
    <circle cx="1400" cy="480" r="2.5"/><circle cx="1000" cy="420" r="2"/><circle cx="560" cy="420" r="2"/>
  </g>
  <!-- bright star near astronaut B (1120,200) -->
  <g transform="translate(1120 190)" fill="#FFB61E"><path d="M0 -34 L9 -9 L34 0 L9 9 L0 34 L-9 9 L-34 0 L-9 -9 Z"/><circle r="50" opacity="0.15"/></g>
  <!-- ringed planet -->
  <g transform="translate(1420 200)"><circle r="70" fill="#F25C7A"/><ellipse rx="120" ry="24" fill="none" stroke="#FFB61E" stroke-width="10" transform="rotate(-20)"/></g>
  <!-- Earth -->
  <g transform="translate(120 200)"><circle r="56" fill="#2FA4D6"/><path d="M-30 -20 q20 -20 40 0 q-10 30 -40 20 z" fill="#5BBF6B"/><path d="M0 20 q25 -5 30 20 q-30 10 -30 -20 z" fill="#5BBF6B"/></g>
  <!-- big spaceship (astronaut A near 480,360) -->
  <g transform="translate(380 330)">
    <ellipse rx="110" ry="46" fill="#FFF8EC" stroke="#2B2A33" stroke-width="4"/>
    <ellipse cy="-30" rx="50" ry="34" fill="#7CD0EC" stroke="#2B2A33" stroke-width="4"/>
    <circle cx="-60" r="10" fill="#FFB61E"/><circle r="10" fill="#F25C7A"/><circle cx="60" r="10" fill="#5BBF6B"/>
    <path d="M-40 46 L-70 90 M40 46 L70 90" stroke="#2B2A33" stroke-width="6"/>
  </g>
  <!-- space station top -->
  <g transform="translate(800 120)"><rect x="-90" y="-16" width="180" height="32" rx="8" fill="#B8B9CC" stroke="#2B2A33" stroke-width="3"/><rect x="-160" y="-40" width="60" height="80" fill="#2FA4D6"/><rect x="100" y="-40" width="60" height="80" fill="#2FA4D6"/></g>
  <!-- comet -->
  <path d="M1500 420 q-120 20 -260 100" stroke="#FFB61E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/><circle cx="1500" cy="420" r="14" fill="#FFF8EC"/>
  <!-- decoy floating astronauts -->
  <g>
    <circle cx="700" cy="380" r="18" fill="#FFF8EC" stroke="#2B2A33" stroke-width="3"/><rect x="684" y="398" width="32" height="40" rx="10" fill="#FFF8EC" stroke="#2B2A33" stroke-width="3"/>
    <circle cx="1300" cy="520" r="18" fill="#FFF8EC" stroke="#2B2A33" stroke-width="3"/><rect x="1284" y="538" width="32" height="40" rx="10" fill="#FFF8EC" stroke="#2B2A33" stroke-width="3"/>
    <circle cx="240" cy="560" r="16" fill="#FFF8EC" stroke="#2B2A33" stroke-width="3"/><rect x="226" y="576" width="28" height="36" rx="10" fill="#FFF8EC" stroke="#2B2A33" stroke-width="3"/>
  </g>
  <!-- moon surface -->
  <path d="M0 680 Q300 620 600 690 T1200 660 T1600 700 L1600 1000 L0 1000 Z" fill="url(#moon)"/>
  <g fill="#7B7C96">
    <ellipse cx="288" cy="900" rx="60" ry="22"/><ellipse cx="1000" cy="930" rx="90" ry="26"/><ellipse cx="1450" cy="860" rx="70" ry="20"/><ellipse cx="640" cy="960" rx="50" ry="16"/>
  </g>
  <!-- flag near rover A (880,800) -->
  <rect x="840" y="720" width="5" height="90" fill="#FFF8EC"/><path d="M845 722 L900 740 L845 758 Z" fill="#F25C7A"/>
  <!-- moon rock (base part) near aliens A (1280,720) -->
  <ellipse cx="1280" cy="740" rx="60" ry="30" fill="#6E6F8A"/>
  <!-- flying saucer body (top) near aliens B (720,600) -->
  <g transform="translate(720 610)"><ellipse cy="-20" rx="40" ry="26" fill="#7CD0EC" stroke="#2B2A33" stroke-width="3"/></g>
  <!-- aliens near both spots -->
  <text x="1210" y="705" font-size="36">👽</text><text x="1330" y="705" font-size="30">👽</text><text x="660" y="600" font-size="34">👽</text>
  <!-- ambient alien (1376,440..510) -->
  <text x="1370" y="500" font-size="44">👾</text>
  <!-- decoy rover -->
  <text x="1120" y="900" font-size="44">🚀</text><text x="440" y="830" font-size="40">🛰️</text>
</svg>
