name: Quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Core quality and privacy
    runs-on: ubuntu-latest
    # The two expensive complete-world files have isolated runners below.
    # Every other test, validators and the private-asset build audit stay here.
    timeout-minutes: 100
    env:
      APP_COMMIT: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and core tests
        run: npm run check -- --maxWorkers=4 --exclude src/services/generation/__tests__/local-patch-lean-world.test.ts --exclude src/services/generation/__tests__/detectives-single-review-world.test.ts
      - run: npm run scenes:validate
      - run: npm run adventures:validate
      - name: Production build and private-asset audit
        # Invariant tests must not inherit a development application environment.
        env:
          APP_ENV: development
          APP_URL: https://ci.invalid
          SESSION_SECRET: ci-synthetic-secret-not-valid-on-any-deployment
          DATABASE_URL: file:./ci.db
          PAYMENT_PROVIDER: mock
          GENERATION_PROVIDER: mock
          EMAIL_PROVIDER: console
          STORAGE_PROVIDER: local
          ANALYTICS_PROVIDER: none
        # Only this step's disposable SQLite DB; never a deployment database.
        run: |
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          npm run build
      - name: No generated source drift
        run: git diff --exit-code
      # No deployment credentials, customer DB or paid image provider in CI.

  lean-world:
    name: Complete controlled lean worlds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_COMMIT: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every controlled lean-world scenario
        run: npm run test -- src/services/generation/__tests__/local-patch-lean-world.test.ts --maxWorkers=1
      - name: No lean generated source drift
        run: git diff --exit-code

  detective-world:
    name: Complete Detective worlds (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      APP_COMMIT: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every collected scenario assigned exactly once
        run: node scripts/ci-detective-worlds.mjs --shard ${{ matrix.shard }}/4
      - name: No Detective generated source drift
        run: git diff --exit-code

  # Preserve the required verify status. A skipped, failed or cancelled part
  # cannot turn the full quality gate green, even when the other job passed.
  verify:
    needs: [checks, lean-world, detective-world]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every complete quality job passed
        env:
          CORE_RESULT: ${{ needs.checks.result }}
          LEAN_RESULT: ${{ needs.lean-world.result }}
          DETECTIVE_RESULT: ${{ needs.detective-world.result }}
        run: test "$CORE_RESULT" = success && test "$LEAN_RESULT" = success && test "$DETECTIVE_RESULT" = success
